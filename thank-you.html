<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Received | No Limit LLC</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .thankyou {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 24px;
            z-index: 1;
            position: relative;
        }
        .thankyou-content {
            max-width: 540px;
        }
        .thankyou-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--gradient-subtle);
            border: 1px solid rgba(0,212,255,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 28px;
        }
        .thankyou-icon svg {
            width: 36px;
            height: 36px;
            color: var(--accent);
        }
        .thankyou h1 {
            font-family: var(--font-display);
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--text-heading);
            margin-bottom: 16px;
        }
        .thankyou p {
            font-size: 1.1rem;
            color: var(--text-muted);
            line-height: 1.7;
            margin-bottom: 32px;
        }
    </style>
</head>
<body>
    <div class="bg-grid" aria-hidden="true"></div>
    <div class="bg-glow bg-glow-1" aria-hidden="true"></div>
    <div class="bg-glow bg-glow-2" aria-hidden="true"></div>

    <section class="thankyou">
        <div class="thankyou-content">
            <div class="thankyou-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <h1>Application <span class="gradient-text">Received!</span></h1>
            <p>
                Thank you for your interest in joining No Limit LLC. Our team will review your 
                application and reach out to schedule an interview. We look forward to connecting with you!
            </p>
            <a href="index.html" class="btn btn-primary">
                Back to Home
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M4 10h12M12 4l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </a>
        </div>
    </section>
</body>
</html>
